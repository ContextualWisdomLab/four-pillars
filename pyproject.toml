[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "four-pillars"
version = "0.4.0"
description = "Deterministic Korean Four Pillars calculation and NVIDIA NIM report generation service"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Contextual Wisdom Lab" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "korean-lunar-calendar>=0.3.1,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.2,<5",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hatchling>=1.26,<2",
  "httpx2>=2.7,<3",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1"
]

[project.scripts]
four-pillars = "four_pillars.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/four_pillars"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "nim_live: calls the hosted NVIDIA NIM API and requires NVIDIA_NIM_API_KEY"
]
filterwarnings = [
  "error::ResourceWarning",
  "error::starlette.testclient.StarletteDeprecationWarning"
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["four_pillars"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["four_pillars"]
plugins = ["pydantic.mypy"]
