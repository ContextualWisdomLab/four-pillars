services:
  api:
    build: .
    env_file: .env
    command: uvicorn four_pillars.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - artifacts:/app/artifacts
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: four-pillars worker
    volumes:
      - artifacts:/app/artifacts
    restart: unless-stopped

volumes:
  artifacts:
