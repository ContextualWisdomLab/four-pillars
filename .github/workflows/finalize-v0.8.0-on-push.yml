name: Finalize Four Pillars v0.8.0

on:
  push:
    branches:
      - release/v0.8.0
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-four-pillars-v0.8.0
  cancel-in-progress: false

jobs:
  finalize_release_candidate:
    if: github.repository == 'ContextualWisdomLab/four-pillars'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
    steps:
      - name: Check out the release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v0.8.0
          fetch-depth: 0
          persist-credentials: true

      - name: Configure trusted Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge the prerequisite feature and current main
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh pr view 23 --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)" = OPEN ]; then
            unresolved="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}reviews(last:100){nodes{state}}}}}' -F owner='ContextualWisdomLab' -F name='four-pillars' -F number=23 --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
            changes_requested="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviews(last:100){nodes{state}}}}}' -F owner='ContextualWisdomLab' -F name='four-pillars' -F number=23 --jq '[.data.repository.pullRequest.reviews.nodes[] | select(.state == "CHANGES_REQUESTED")] | length')"
            [ "$unresolved" -eq 0 ]
            [ "$changes_requested" -eq 0 ]
            gh pr merge 23 --repo "$GITHUB_REPOSITORY" --squash --delete-branch=false || true
          fi
          git fetch origin main
          git merge --no-edit origin/main
          if [ ! -f .github/workflows/hourly-nim-product-development.yml ]; then
            git fetch origin feat/hourly-nim-product-development
            git merge --no-edit origin/feat/hourly-nim-product-development
          fi

      - name: Align package metadata, release contract, and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          version = "0.8.0"
          release_date = "2026-08-07"

          def replace_one(path: str, pattern: str, replacement: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label} was not uniquely replaceable in {path}")
              target.write_text(updated, encoding="utf-8")

          replace_one(
              "pyproject.toml",
              r'^(version\s*=\s*)"[^"]+"',
              rf'\1"{version}"',
              "project version",
          )
          replace_one(
              "src/four_pillars/version.py",
              r'^(__version__\s*=\s*)"[^"]+"',
              rf'\1"{version}"',
              "runtime version",
          )

          release_test = Path("tests/test_release_version.py")
          test_text = release_test.read_text(encoding="utf-8")
          test_text = re.sub(
              r'^RELEASE_VERSION\s*=\s*"[^"]+"',
              f'RELEASE_VERSION = "{version}"',
              test_text,
              flags=re.MULTILINE,
          )
          test_text = re.sub(
              r'^RELEASE_DATE\s*=\s*"[^"]+"',
              f'RELEASE_DATE = "{release_date}"',
              test_text,
              flags=re.MULTILINE,
          )
          release_test.write_text(test_text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          release_header = f"## [{version}] - {release_date}"
          if release_header not in text:
              match = re.search(
                  r'^## \[Unreleased\]\n(?P<body>.*?)(?=^## \[)',
                  text,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if match is None:
                  raise SystemExit("Unreleased changelog section is missing")
              body = match.group("body").strip("\n")
              sections: dict[str, str] = {}
              current: str | None = None
              buffer: list[str] = []
              for line in body.splitlines():
                  if line.startswith("### "):
                      if current is not None:
                          sections[current] = "\n".join(buffer).strip("\n")
                      current = line[4:].strip()
                      buffer = []
                  elif current is not None:
                      buffer.append(line)
              if current is not None:
                  sections[current] = "\n".join(buffer).strip("\n")

              planned = sections.get("Planned", "").strip()
              release_parts: list[str] = []
              for heading in ("Added", "Changed", "Security", "Fixed", "Deprecated", "Removed"):
                  content = sections.get(heading, "").strip()
                  if content:
                      release_parts.append(f"### {heading}\n\n{content}")
              if not release_parts:
                  raise SystemExit("Unreleased contains no releasable v0.8.0 content")
              unreleased = "## [Unreleased]\n\n"
              if planned:
                  unreleased += f"### Planned\n\n{planned}\n\n"
              release = release_header + "\n\n" + "\n\n".join(release_parts) + "\n\n"
              text = text[:match.start()] + unreleased + release + text[match.end():]

          marker = "### Release assurance\n\n"
          assurance = (
              "- The hourly OpenCode control plane runs at minute 47 through a three-runner "
              "proposal, verification, and publication boundary with an immutable handoff.\n"
              "- Direct model execution uses only `NVIDIA_NIM_API_KEY`; "
              "`COPILOT_GITHUB_TOKEN` remains prohibited and existing reviewer credentials are unchanged.\n"
              "- Release evidence includes APA 7 doctoring, no merge from the model workflow, "
              "and 100% statement and branch coverage.\n"
          )
          start = text.index(release_header)
          next_release = text.find("\n## [", start + len(release_header))
          if next_release < 0:
              next_release = len(text)
          section = text[start:next_release]
          if marker not in section:
              insertion = next_release
              text = text[:insertion].rstrip() + "\n\n" + marker + assurance + "\n" + text[insertion:].lstrip("\n")

          compare_link = f"[Unreleased]: https://github.com/ContextualWisdomLab/four-pillars/compare/v{version}...HEAD"
          text, count = re.subn(
              r'^\[Unreleased\]:.*$',
              compare_link,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Unreleased comparison link is missing")
          release_link = f"[{version}]: https://github.com/ContextualWisdomLab/four-pillars/releases/tag/v{version}"
          if release_link not in text:
              text = text.replace(compare_link, compare_link + "\n" + release_link, 1)
          changelog.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary release-control workflows
        run: |
          rm -f .github/workflows/prepare-v0.8.0.yml
          rm -f .github/workflows/prepare-v0.8.0-on-push.yml
          rm -f .github/workflows/finalize-v0.8.0-on-push.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install immutable verification environment
        run: python -m pip install --require-hashes -r requirements/ci.txt

      - name: Run the complete release-quality gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          python scripts/product_gap_audit.py
          ruff check .
          python -m compileall -q src tests scripts
          python scripts/check_docs.py
          python scripts/check_prompts.py
          pytest -m 'not nim_live' -W error::ResourceWarning \
            --cov=four_pillars --cov-report=term-missing
          python -m build --no-isolation

      - name: Commit and push the verified release candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'release: prepare Four Pillars v0.8.0'
            git push origin HEAD:release/v0.8.0
          fi
