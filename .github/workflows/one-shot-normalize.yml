name: One-shot branch normalization

on:
  push:
    branches: [feat/four-pillars-v1]
    paths: [.github/workflows/one-shot-normalize.yml]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/four-pillars-v1
      - name: Apply deterministic source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          needle = 'dev = [\n  "mypy>=1.14,<2",'
          replacement = 'dev = [\n  "build>=1.2,<2",\n  "mypy>=1.14,<2",'
          if needle not in text:
              raise SystemExit('pyproject insertion point not found')
          pyproject.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          synthesis = Path('src/four_pillars/prompts/synthesis.md')
          body = synthesis.read_text(encoding='utf-8')
          needle = '# Quality requirements'
          if needle not in body:
              raise SystemExit('synthesis heading not found')
          synthesis.write_text(body.replace(needle, '# Immutable quality requirements', 1), encoding='utf-8')
          PY
          rm .github/workflows/one-shot-normalize.yml
          git add --all
          git diff --cached --check
      - name: Commit normalized source
        run: |
          git config user.name 'four-pillars-ci'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: normalize prompt validation and package build'
          git push origin HEAD:feat/four-pillars-v1
