name: Recover Four Pillars v0.8.0 Release

on:
  push:
    branches:
      - release/v0.8.0
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: recover-four-pillars-v0.8.0
  cancel-in-progress: false

jobs:
  recover_release:
    if: github.repository == 'ContextualWisdomLab/four-pillars'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
      RELEASE_VERSION: 0.8.0
      RELEASE_TAG: v0.8.0
    steps:
      - name: Check out release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v0.8.0
          fetch-depth: 0
          persist-credentials: true

      - name: Configure trusted Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Determine whether release pull request is still open
        id: state
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view 24 --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || printf CLOSED)"
          echo "state=$state" >>"$GITHUB_OUTPUT"

      - name: Normalize open release candidate
        if: steps.state.outputs.state == 'OPEN'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          if [ ! -f .github/workflows/hourly-nim-product-development.yml ]; then
            git fetch origin feat/hourly-nim-product-development
            git merge --no-edit origin/feat/hourly-nim-product-development
          fi
          python - <<'PY'
          from pathlib import Path
          import re

          version = "0.8.0"
          release_date = "2026-08-07"
          replacements = (
              (Path("pyproject.toml"), r'^(version\s*=\s*)"[^"]+"', rf'\1"{version}"', "package"),
              (Path("src/four_pillars/version.py"), r'^(__version__\s*=\s*)"[^"]+"', rf'\1"{version}"', "runtime"),
          )
          for path, pattern, replacement, label in replacements:
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label} version is not uniquely replaceable")
              path.write_text(updated, encoding="utf-8")

          test_path = Path("tests/test_release_version.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = re.sub(r'^RELEASE_VERSION\s*=\s*"[^"]+"', f'RELEASE_VERSION = "{version}"', test_text, flags=re.MULTILINE)
          test_text = re.sub(r'^RELEASE_DATE\s*=\s*"[^"]+"', f'RELEASE_DATE = "{release_date}"', test_text, flags=re.MULTILINE)
          test_path.write_text(test_text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          header = f"## [{version}] - {release_date}"
          if header not in text:
              match = re.search(r'^## \[Unreleased\]\n(?P<body>.*?)(?=^## \[)', text, flags=re.MULTILINE | re.DOTALL)
              if match is None:
                  raise SystemExit("Unreleased section is missing")
              body = match.group("body").strip("\n")
              sections: dict[str, str] = {}
              for part in re.split(r'(?m)^### ', body)[1:]:
                  heading, _, content = part.partition("\n")
                  sections[heading.strip()] = content.strip("\n")
              planned = sections.get("Planned", "").strip()
              release_sections = []
              for heading in ("Added", "Changed", "Security", "Fixed", "Deprecated", "Removed"):
                  content = sections.get(heading, "").strip()
                  if content:
                      release_sections.append(f"### {heading}\n\n{content}")
              if not release_sections:
                  raise SystemExit("No releasable Unreleased content exists")
              unreleased = "## [Unreleased]\n\n"
              if planned:
                  unreleased += f"### Planned\n\n{planned}\n\n"
              release = header + "\n\n" + "\n\n".join(release_sections) + "\n\n"
              text = text[:match.start()] + unreleased + release + text[match.end():]

          start = text.index(header)
          end = text.find("\n## [", start + len(header))
          if end < 0:
              end = len(text)
          section = text[start:end]
          phrases = (
              "hourly OpenCode",
              "minute 47",
              "three-runner",
              "immutable handoff",
              "NVIDIA_NIM_API_KEY",
              "COPILOT_GITHUB_TOKEN",
              "100% statement and branch coverage",
              "no merge",
              "APA 7",
          )
          if not all(item.casefold() in section.casefold() for item in phrases):
              assurance = (
                  "### Release assurance\n\n"
                  "- The hourly OpenCode control plane runs at minute 47 through a three-runner boundary and an immutable handoff.\n"
                  "- Direct model execution uses only `NVIDIA_NIM_API_KEY`; `COPILOT_GITHUB_TOKEN` remains prohibited and reviewer credentials are unchanged.\n"
                  "- APA 7 doctoring, no merge from the model workflow, and 100% statement and branch coverage remain release gates.\n\n"
              )
              text = text[:end].rstrip() + "\n\n" + assurance + text[end:].lstrip("\n")

          compare = f"[Unreleased]: https://github.com/ContextualWisdomLab/four-pillars/compare/v{version}...HEAD"
          text, count = re.subn(r'^\[Unreleased\]:.*$', compare, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("Unreleased comparison link is missing")
          release_link = f"[{version}]: https://github.com/ContextualWisdomLab/four-pillars/releases/tag/v{version}"
          if release_link not in text:
              text = text.replace(compare, compare + "\n" + release_link, 1)
          changelog.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/prepare-v0.8.0.yml
          rm -f .github/workflows/prepare-v0.8.0-on-push.yml
          rm -f .github/workflows/finalize-v0.8.0-on-push.yml
          rm -f .github/workflows/complete-v0.8.0.yml
          rm -f .github/workflows/recover-v0.8.0-release.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install immutable verification environment
        run: python -m pip install --require-hashes -r requirements/ci.txt

      - name: Verify open release candidate
        if: steps.state.outputs.state == 'OPEN'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          python scripts/product_gap_audit.py
          ruff check .
          python -m compileall -q src tests scripts
          python scripts/check_docs.py
          python scripts/check_prompts.py
          pytest -m 'not nim_live' -W error::ResourceWarning --cov=four_pillars --cov-report=term-missing
          python -m build --no-isolation

      - name: Reject unresolved release reviews
        if: steps.state.outputs.state == 'OPEN'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh pr view 24 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready 24 --repo "$GITHUB_REPOSITORY"
          fi
          data="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}reviews(last:100){nodes{state}}}}}' -F owner='ContextualWisdomLab' -F name='four-pillars' -F number=24)"
          [ "$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$data")" -eq 0 ]
          [ "$(jq '[.data.repository.pullRequest.reviews.nodes[] | select(.state == "CHANGES_REQUESTED")] | length' <<<"$data")" -eq 0 ]

      - name: Commit verified release tree
        if: steps.state.outputs.state == 'OPEN'
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'release: prepare Four Pillars v0.8.0'
            git push origin HEAD:release/v0.8.0
          fi
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Merge verified release candidate
        if: steps.state.outputs.state == 'OPEN'
        id: merge_open
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.candidate.outputs.sha }}"
          [ "$(gh pr view 24 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$sha" ]
          response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/24/merge" -f sha="$sha" -f merge_method=squash -f commit_title='release: publish Four Pillars v0.8.0')"
          jq -e '.merged == true' <<<"$response" >/dev/null
          merge_sha="$(jq -r .sha <<<"$response")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$merge_sha" >>"$GITHUB_OUTPUT"

      - name: Resolve main release commit
        id: main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.state.outputs.state }}" = OPEN ]; then
            sha="${{ steps.merge_open.outputs.sha }}"
          else
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Verify and package the main release commit
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.main.outputs.sha }}"
          git fetch origin main --tags
          git checkout --detach "$sha"
          [ "$(git rev-parse HEAD)" = "$sha" ]
          [ "$(python -c 'from four_pillars import __version__; print(__version__)')" = "$RELEASE_VERSION" ]
          python -m pip check
          ruff check .
          pytest -m 'not nim_live' -W error::ResourceWarning --cov=four_pillars --cov-report=term-missing
          rm -rf dist
          python -m build --no-isolation
          (
            cd dist
            sha256sum four_pillars-0.8.0.tar.gz four_pillars-0.8.0-py3-none-any.whl >SHA256SUMS
          )
          python - <<'PY'
          from pathlib import Path
          import os
          version = "0.8.0"
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = f"## [{version}]"
          section = text.split(header, 1)[1].split("\n## [", 1)[0].strip()
          target = Path(os.environ["RUNNER_TEMP"]) / "four-pillars-v0.8.0-release-notes.md"
          target.write_text(section + "\n", encoding="utf-8")
          PY

      - name: Publish or verify immutable release
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ steps.main.outputs.sha }}"
          notes="$RUNNER_TEMP/four-pillars-v0.8.0-release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
            [ "$(git rev-list -n 1 "$RELEASE_TAG")" = "$sha" ]
            assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for name in four_pillars-0.8.0.tar.gz four_pillars-0.8.0-py3-none-any.whl SHA256SUMS; do
              grep -Fx "$name" <<<"$assets" >/dev/null
            done
          else
            gh release create "$RELEASE_TAG" \
              dist/four_pillars-0.8.0.tar.gz \
              dist/four_pillars-0.8.0-py3-none-any.whl \
              dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$sha" \
              --title 'Four Pillars v0.8.0' \
              --notes-file "$notes"
          fi

      - name: Drain superseded prerequisite pull request
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh pr view 23 --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)" = OPEN ]; then
            gh pr close 23 --repo "$GITHUB_REPOSITORY" --comment 'The reviewed feature and release shipped through #24 and v0.8.0; the duplicate queue item is now drained.'
          fi
