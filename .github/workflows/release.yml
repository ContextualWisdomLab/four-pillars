name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: src
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install the immutable verification environment
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - run: python -m pip check
      - run: python scripts/product_gap_audit.py
      - run: ruff check .
      - run: python -m compileall -q src tests scripts
      - run: python scripts/check_docs.py
      - run: python scripts/check_prompts.py
      - run: pytest -m 'not nim_live' -W error::ResourceWarning --cov=four_pillars --cov-report=term-missing
      - run: python -m build --no-isolation
      - name: Build the pinned runtime container
        run: docker build --tag four-pillars:release .

  publish:
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install the immutable build environment
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Build versioned distribution and curated release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from four_pillars import __version__; print(__version__)')"
          tag="v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          python scripts/release_notes.py --version "$version" --output release-notes.md
          python -m build --no-isolation
          (
            cd dist
            sha256sum four_pillars-* > SHA256SUMS
          )
      - name: Publish the version once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; publication is idempotently complete."
            exit 0
          fi
          gh release create "$TAG" dist/four_pillars-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Four Pillars $TAG" \
            --notes-file release-notes.md
