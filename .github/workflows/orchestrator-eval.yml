name: Contextual Orchestrator Free Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install the immutable evaluation environment
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - run: python -m pip check
      - name: Require the orchestration gateway contract
        env:
          CONTEXTUAL_ORCHESTRATOR_TOKEN: ${{ secrets.CONTEXTUAL_ORCHESTRATOR_TOKEN }}
          CONTEXTUAL_ORCHESTRATOR_BASE_URL: ${{ vars.CONTEXTUAL_ORCHESTRATOR_BASE_URL }}
        run: |
          if [ -z "$CONTEXTUAL_ORCHESTRATOR_TOKEN" ]; then
            echo '::error::CONTEXTUAL_ORCHESTRATOR_TOKEN is required.'
            exit 1
          fi
          if [ -z "$CONTEXTUAL_ORCHESTRATOR_BASE_URL" ]; then
            echo '::error::CONTEXTUAL_ORCHESTRATOR_BASE_URL repository variable is required.'
            exit 1
          fi
      - name: orchestrator/free smoke test
        env:
          INTERPRETATION_BACKEND: contextual_orchestrator
          CONTEXTUAL_ORCHESTRATOR_TOKEN: ${{ secrets.CONTEXTUAL_ORCHESTRATOR_TOKEN }}
          CONTEXTUAL_ORCHESTRATOR_BASE_URL: ${{ vars.CONTEXTUAL_ORCHESTRATOR_BASE_URL }}
          CONTEXTUAL_ORCHESTRATOR_MODEL: orchestrator/free
          CONTEXTUAL_ORCHESTRATOR_MODE: auto
        run: pytest -m orchestrator_live -vv
      - name: orchestrator/free judge fixture
        env:
          INTERPRETATION_BACKEND: contextual_orchestrator
          CONTEXTUAL_ORCHESTRATOR_TOKEN: ${{ secrets.CONTEXTUAL_ORCHESTRATOR_TOKEN }}
          CONTEXTUAL_ORCHESTRATOR_BASE_URL: ${{ vars.CONTEXTUAL_ORCHESTRATOR_BASE_URL }}
          CONTEXTUAL_ORCHESTRATOR_MODEL: orchestrator/free
          CONTEXTUAL_ORCHESTRATOR_MODE: auto
        run: python scripts/orchestrator_eval.py
