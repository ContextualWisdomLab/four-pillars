name: NVIDIA NIM Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install the immutable evaluation environment
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - run: python -m pip check
      - name: Require the hosted NIM credential
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |
          if [ -z "$NVIDIA_NIM_API_KEY" ]; then
            echo '::error::NVIDIA_NIM_API_KEY is required for hosted NIM evaluation.'
            exit 1
          fi
      - name: Hosted NIM smoke test
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NIM_MODEL: ${{ vars.NIM_MODEL || 'nvidia/llama-3.3-nemotron-super-49b-v1.5' }}
          NIM_EVAL_MODEL: ${{ vars.NIM_EVAL_MODEL || 'nvidia/llama-3.3-nemotron-super-49b-v1.5' }}
        run: pytest -m nim_live -vv
      - name: NIM-as-judge fixture
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NIM_MODEL: ${{ vars.NIM_MODEL || 'nvidia/llama-3.3-nemotron-super-49b-v1.5' }}
          NIM_EVAL_MODEL: ${{ vars.NIM_EVAL_MODEL || 'nvidia/llama-3.3-nemotron-super-49b-v1.5' }}
        run: python scripts/nim_eval.py
