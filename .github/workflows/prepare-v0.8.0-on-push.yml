name: Prepare Four Pillars v0.8.0 on Push

on:
  push:
    branches:
      - release/v0.8.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-four-pillars-v0.8.0
  cancel-in-progress: false

jobs:
  prepare_release:
    if: github.repository == 'ContextualWisdomLab/four-pillars'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v0.8.0
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and prerequisite feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          if [ ! -f .github/workflows/hourly-nim-product-development.yml ]; then
            git fetch origin feat/hourly-nim-product-development
            git merge --no-edit origin/feat/hourly-nim-product-development
          fi

      - name: Prepare aligned v0.8.0 metadata and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          version = "0.8.0"
          release_date = "2026-08-07"

          def replace_once(path: Path, pattern: str, replacement: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label} was not uniquely replaceable in {path}")
              path.write_text(updated, encoding="utf-8")

          replace_once(
              Path("pyproject.toml"),
              r'^(version\s*=\s*)"[^"]+"',
              rf'\1"{version}"',
              "project version",
          )
          replace_once(
              Path("src/four_pillars/version.py"),
              r'^(__version__\s*=\s*)"[^"]+"',
              rf'\1"{version}"',
              "runtime version",
          )

          release_test = Path("tests/test_release_version.py")
          release_text = release_test.read_text(encoding="utf-8")
          release_text = re.sub(
              r'^RELEASE_VERSION\s*=\s*"[^"]+"',
              f'RELEASE_VERSION = "{version}"',
              release_text,
              flags=re.MULTILINE,
          )
          release_text = re.sub(
              r'^RELEASE_DATE\s*=\s*"[^"]+"',
              f'RELEASE_DATE = "{release_date}"',
              release_text,
              flags=re.MULTILINE,
          )
          release_test.write_text(release_text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          if f"## [{version}] - " not in text:
              match = re.search(
                  r'^## \[Unreleased\]\n(?P<body>.*?)(?=^## \[)',
                  text,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if match is None:
                  raise SystemExit("Unreleased changelog section is missing")
              body = match.group("body").strip("\n")
              sections: dict[str, str] = {}
              current: str | None = None
              buffer: list[str] = []
              for line in body.splitlines():
                  if line.startswith("### "):
                      if current is not None:
                          sections[current] = "\n".join(buffer).strip("\n")
                      current = line[4:].strip()
                      buffer = []
                  elif current is not None:
                      buffer.append(line)
              if current is not None:
                  sections[current] = "\n".join(buffer).strip("\n")

              planned = sections.get("Planned", "").strip()
              release_parts: list[str] = []
              for heading in (
                  "Added",
                  "Changed",
                  "Security",
                  "Fixed",
                  "Deprecated",
                  "Removed",
              ):
                  content = sections.get(heading, "").strip()
                  if content:
                      release_parts.append(f"### {heading}\n\n{content}")
              if not release_parts:
                  raise SystemExit("Unreleased contains no v0.8.0 release notes")

              unreleased = "## [Unreleased]\n\n"
              if planned:
                  unreleased += f"### Planned\n\n{planned}\n\n"
              release = (
                  f"## [{version}] - {release_date}\n\n"
                  + "\n\n".join(release_parts)
                  + "\n\n"
              )
              text = text[: match.start()] + unreleased + release + text[match.end() :]

          compare_link = (
              f"[Unreleased]: https://github.com/ContextualWisdomLab/four-pillars/compare/v{version}...HEAD"
          )
          text, count = re.subn(
              r'^\[Unreleased\]:.*$',
              compare_link,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Unreleased comparison link is missing")
          release_link = (
              f"[{version}]: https://github.com/ContextualWisdomLab/four-pillars/releases/tag/v{version}"
          )
          if release_link not in text:
              text = text.replace(compare_link, compare_link + "\n" + release_link, 1)
          changelog.write_text(text, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install immutable verification environment
        run: python -m pip install --require-hashes -r requirements/ci.txt

      - name: Run complete release-quality gate
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip check
          python scripts/product_gap_audit.py
          ruff check .
          python -m compileall -q src tests scripts
          python scripts/check_docs.py
          python scripts/check_prompts.py
          pytest -m 'not nim_live' -W error::ResourceWarning \
            --cov=four_pillars --cov-report=term-missing
          python -m build --no-isolation

      - name: Commit release preparation and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-v0.8.0.yml
          rm -f .github/workflows/prepare-v0.8.0-on-push.yml
          git add -A
          git diff --cached --check
          git -c core.hooksPath=/dev/null commit -m 'release: prepare Four Pillars v0.8.0'
          git push origin HEAD:release/v0.8.0
