name: One-shot repair, verify, and clean

on:
  push:
    branches: [feat/four-pillars-v1]
    paths: [.github/workflows/one-shot-format-verify.yml]

permissions:
  contents: write

jobs:
  repair-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/four-pillars-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Repair explicit static-analysis findings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/four_pillars/prompts/__init__.py')
          text = path.read_text(encoding='utf-8')
          target = 'from importlib.resources import files\n'
          replacement = (
              '# The project requires Python 3.11+, so importlib.resources is available.\n'
              'from importlib.resources import files  # nosemgrep\n'
          )
          if target in text and '# nosemgrep' not in text:
              text = text.replace(target, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Format and lint
        run: |
          ruff check --fix .
          ruff format .
          ruff check .
      - name: Deterministic and document verification
        run: |
          python -m compileall -q src tests scripts
          python scripts/check_docs.py
          python scripts/check_prompts.py
      - name: Offline tests and package build
        run: |
          pytest -m 'not nim_live' -W error::ResourceWarning --cov=four_pillars --cov-report=term-missing
          python -m build
      - name: Remove one-shot maintenance workflows
        run: rm -f .github/workflows/one-shot-*.yml
      - name: Commit verified repair
        run: |
          git config user.name 'four-pillars-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix: satisfy CI formatting and security gates'
          git push origin HEAD:feat/four-pillars-v1
