name: One-shot format and verify

on:
  push:
    branches: [feat/four-pillars-v1]
    paths: [.github/workflows/one-shot-format-verify.yml]

permissions:
  contents: write

jobs:
  format-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/four-pillars-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Normalize known source issues
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('pyproject.toml')
          text = p.read_text(encoding='utf-8')
          if '"build>=1.2,<2"' not in text:
              text = text.replace('dev = [\n', 'dev = [\n  "build>=1.2,<2",\n', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('src/four_pillars/prompts/synthesis.md')
          text = p.read_text(encoding='utf-8').replace(
              '# Quality requirements', '# Immutable quality requirements', 1
          )
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_fortune.py')
          text = p.read_text(encoding='utf-8').replace(
              'zip(scenario.periods, scenario.periods[1:], strict=True)',
              'zip(scenario.periods, scenario.periods[1:])',
          )
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/one-shot-normalize.yml .github/workflows/one-shot-verify.yml .github/workflows/one-shot-format-verify.yml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check --fix .
      - run: ruff format .
      - run: ruff check .
      - run: python -m compileall -q src tests scripts
      - run: python scripts/check_docs.py
      - run: python scripts/check_prompts.py
      - run: pytest -m 'not nim_live' -W error::ResourceWarning --cov=four_pillars --cov-report=term-missing
      - run: python -m build
      - name: Commit verified source
        run: |
          git config user.name 'four-pillars-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'test: format and verify Four Pillars service'
          git push origin HEAD:feat/four-pillars-v1
