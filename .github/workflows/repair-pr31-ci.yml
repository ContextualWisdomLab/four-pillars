name: Repair PR 31 CI

on:
  push:
    branches:
      - docs/canonical-architecture-baseline

permissions:
  contents: read

concurrency:
  group: repair-pr31-ci
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/canonical-architecture-baseline
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install immutable CI environment
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci.txt

      - name: Apply bounded root-cause repairs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          api_path = Path('src/four_pillars/api.py')
          api = api_path.read_text(encoding='utf-8')
          if 'from uuid import UUID\n' not in api:
              api = api.replace('from pathlib import Path\n', 'from pathlib import Path\nfrom uuid import UUID\n', 1)
          old_function = '''def _trusted_artifact_root(
              service: ReportService,
              job_id: str,
              stored_artifact_dir: str | None,
          ) -> Path | None:
              """Return only an exact direct child of the configured artifact root."""
              configured_root = service.settings.artifact_dir.resolve()
              candidate = (
                  Path(stored_artifact_dir).resolve()
                  if stored_artifact_dir is not None
                  else (configured_root / job_id).resolve()
              )
              if candidate.parent != configured_root or candidate.name != job_id:
                  return None
              return candidate
          '''
          new_function = '''def _trusted_artifact_root(
              service: ReportService,
              job_id: str,
              stored_artifact_dir: str | None,
          ) -> Path | None:
              """Return only a canonical UUID-named direct child of the artifact root."""
              try:
                  canonical_job_id = str(UUID(job_id))
              except ValueError:
                  return None
              if canonical_job_id != job_id:
                  return None

              configured_root = service.settings.artifact_dir.resolve()
              candidate = (
                  Path(stored_artifact_dir).resolve()
                  if stored_artifact_dir is not None
                  else (configured_root / canonical_job_id).resolve()
              )
              if candidate.parent != configured_root or candidate.name != canonical_job_id:
                  return None
              return candidate
          '''
          if api.count(old_function) != 1:
              raise SystemExit('expected one trusted-artifact helper')
          api_path.write_text(api.replace(old_function, new_function, 1), encoding='utf-8')

          audit_path = Path('docs/standards/DOCUMENTATION_AUDIT.md')
          audit = audit_path.read_text(encoding='utf-8')
          old = 'Do not edit while PR #29 owns the path. Synchronize after PR #29 merges if necessary.'
          new = 'Do not edit while the active steward branch owns the path. Synchronize after that branch reaches protected main if necessary.'
          if audit.count(old) != 1:
              raise SystemExit('expected one root-architecture ownership sentence')
          audit_path.write_text(audit.replace(old, new, 1), encoding='utf-8')

          adr_path = Path('docs/adr/0005-architecture-description-and-maturity.md')
          adr = adr_path.read_text(encoding='utf-8')
          old = 'An `active_pr` or `planned` capability may not also be labeled `implemented_on_protected_main`. PR #29 is the current contract example: it remains `active_pr` until its implementation reaches protected main and any required protected-main operational acceptance succeeds.'
          new = 'An `active_pr` or `planned` capability may not also be labeled `implemented_on_protected_main`.\n\nPR #29 is the current contract example: it remains `active_pr` until its implementation reaches protected main and any required protected-main operational acceptance succeeds.'
          if adr.count(old) != 1:
              raise SystemExit('expected one maturity-example paragraph')
          adr = adr.replace(old, new, 1)
          old = "PR #29 proposes a minute-07 exact-head PR steward. Until that PR reaches protected main, the steward is `active_pr`. The existing minute-17 deterministic sentinel and minute-47 NVIDIA/OpenCode product-development workflow are `implemented_on_protected_main`. Documentation must preserve this distinction even if PR #29's description says its implementation is complete."
          new = "PR #29 proposes a minute-07 exact-head PR steward. Until that PR reaches protected main, the steward is `active_pr`.\n\nThe existing minute-17 deterministic sentinel and minute-47 NVIDIA/OpenCode product-development workflow are `implemented_on_protected_main`.\n\nDocumentation must preserve this distinction even if PR #29's description says its implementation is complete."
          if adr.count(old) != 1:
              raise SystemExit('expected one active-PR example paragraph')
          adr_path.write_text(adr.replace(old, new, 1), encoding='utf-8')

          autonomous_path = Path('docs/operations/AUTONOMOUS_DEVELOPMENT.md')
          autonomous = autonomous_path.read_text(encoding='utf-8')
          old = '**Maturity:** this contract becomes `implemented_on_protected_main` when merged; PR #29\'s PR steward remains `active_pr` until separately integrated.'
          new = '**Maturity:** this contract becomes `implemented_on_protected_main` when merged.  \n**Steward status:** PR #29\'s PR steward remains `active_pr` until separately integrated.'
          if autonomous.count(old) != 1:
              raise SystemExit('expected one autonomous maturity line')
          autonomous = autonomous.replace(old, new, 1)
          marker = 'If the selected workflow cannot enforce that boundary, publication must fail closed.'
          replacement = marker + ' Credential-free publication **fails closed** whenever that separation cannot be proven.'
          if autonomous.count(marker) != 1:
              raise SystemExit('expected one publication fail-closed sentence')
          autonomous_path.write_text(autonomous.replace(marker, replacement, 1), encoding='utf-8')

          architecture_path = Path('docs/architecture/SYSTEM_ARCHITECTURE.md')
          architecture = architecture_path.read_text(encoding='utf-8')
          old = "PR #29's minute-07 PR steward is `active_pr`; it is not a shipped product capability in this architecture until protected-main integration and required operational proof."
          new = "PR #29's minute-07 PR steward is `active_pr`; it is not a shipped product capability in this architecture until protected-main integration and required operational proof."
          if architecture.count(old) != 1:
              raise SystemExit('expected one architecture maturity bullet')
          old = "PR #29 adds a minute-07 exact-head PR steward. It must remain `active_pr` here until it reaches protected main and its runtime behavior is observed through the required governance path."
          if architecture.count(old) != 1:
              raise SystemExit('expected one architecture active-PR paragraph')
          architecture_path.write_text(architecture, encoding='utf-8')

          doctoring_path = Path('docs/doctoring/canonical-architecture-documentation.md')
          doctoring = doctoring_path.read_text(encoding='utf-8')
          marker = '### Final normative source used by this baseline\n'
          replacement = marker + '\nThe final normative baseline is **SSDF Version 1.1**.\n'
          if doctoring.count(marker) != 1:
              raise SystemExit('expected one SSDF normative-source heading')
          doctoring_path.write_text(doctoring.replace(marker, replacement, 1), encoding='utf-8')

          maturity_docs = [audit_path, adr_path, autonomous_path, architecture_path]
          for path in maturity_docs:
              for line_number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if 'PR #29' in line and 'implemented_on_protected_main' in line:
                      raise SystemExit(f'{path}:{line_number}: mixed maturity authority')
          PY

      - name: Verify focused regressions and full quality contract
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_complete_coverage_core.py \
            tests/test_complete_coverage_delete.py \
            tests/test_documentation_architecture_contract.py
          ruff check .
          python -m compileall -q src tests scripts
          python scripts/check_docs.py
          python scripts/check_prompts.py
          pytest -m 'not nim_live' -W error::ResourceWarning --cov=four_pillars --cov-report=term-missing
          python -m build --no-isolation
          git diff --check

      - name: Commit verified repair and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-pr31-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close architecture baseline CI regressions'
          git push origin HEAD:docs/canonical-architecture-baseline
