name: One-shot calendar regression repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feat/four-pillars-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/four-pillars-v1
          fetch-depth: 0
      - name: Repair solar-term ordering regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/four_pillars/calendar.py')
          text = path.read_text(encoding='utf-8')
          old = '''    previous = max(term for term in terms if term.occurs_at <= moment)\n    following = min(term for term in terms if term.occurs_at > moment)'''
          new = '''    previous = max(\n        (term for term in terms if term.occurs_at <= moment),\n        key=lambda term: term.occurs_at,\n    )\n    following = min(\n        (term for term in terms if term.occurs_at > moment),\n        key=lambda term: term.occurs_at,\n    )'''
          if old not in text:
              raise SystemExit('expected calendar regression pattern was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm -f .github/workflows/one-shot-calendar-repair.yml
      - name: Commit repaired source
        run: |
          git config user.name 'four-pillars-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix: order solar terms by occurrence time'
          git push origin HEAD:feat/four-pillars-v1
