name: One-shot hashed dependency lock generation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lock:
    if: github.head_ref == 'feat/four-pillars-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/four-pillars-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Generate fully hashed runtime and CI locks
        run: |
          python -m pip install 'pip-tools==7.6.0'
          mkdir -p requirements
          pip-compile pyproject.toml \
            --resolver=backtracking \
            --strip-extras \
            --generate-hashes \
            --no-emit-index-url \
            --output-file=requirements/runtime.txt
          pip-compile pyproject.toml \
            --extra=dev \
            --resolver=backtracking \
            --strip-extras \
            --generate-hashes \
            --no-emit-index-url \
            --output-file=requirements/ci.txt
          rm -f .github/workflows/one-shot-lock-dependencies.yml
      - name: Commit immutable dependency locks
        run: |
          git config user.name 'four-pillars-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'build: add fully hashed dependency locks'
          git push origin HEAD:feat/four-pillars-v1
