name: Complete Four Pillars v0.8.0

on:
  push:
    branches:
      - release/v0.8.0
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: complete-four-pillars-v0.8.0
  cancel-in-progress: false

jobs:
  complete_release:
    if: github.repository == 'ContextualWisdomLab/four-pillars'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src
      RELEASE_VERSION: 0.8.0
      RELEASE_TAG: v0.8.0
    steps:
      - name: Check out the release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v0.8.0
          fetch-depth: 0
          persist-credentials: true

      - name: Configure trusted Git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Normalize final release metadata and remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          version = "0.8.0"
          release_date = "2026-08-07"

          for filename, pattern, replacement, label in (
              ("pyproject.toml", r'^(version\s*=\s*)"[^"]+"', rf'\1"{version}"', "project version"),
              ("src/four_pillars/version.py", r'^(__version__\s*=\s*)"[^"]+"', rf'\1"{version}"', "runtime version"),
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label} was not uniquely replaceable")
              path.write_text(updated, encoding="utf-8")

          release_test = Path("tests/test_release_version.py")
          text = release_test.read_text(encoding="utf-8")
          text = re.sub(r'^RELEASE_VERSION\s*=\s*"[^"]+"', f'RELEASE_VERSION = "{version}"', text, flags=re.MULTILINE)
          text = re.sub(r'^RELEASE_DATE\s*=\s*"[^"]+"', f'RELEASE_DATE = "{release_date}"', text, flags=re.MULTILINE)
          release_test.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          header = f"## [{version}] - {release_date}"
          if header not in text:
              match = re.search(r'^## \[Unreleased\]\n(?P<body>.*?)(?=^## \[)', text, flags=re.MULTILINE | re.DOTALL)
              if match is None:
                  raise SystemExit("Unreleased changelog section is missing")
              body = match.group("body").strip("\n")
              parts = re.split(r'(?m)^### ', body)
              sections: dict[str, str] = {}
              for part in parts[1:]:
                  heading, _, content = part.partition("\n")
                  sections[heading.strip()] = content.strip("\n")
              planned = sections.pop("Planned", "").strip()
              release_sections = []
              for heading in ("Added", "Changed", "Security", "Fixed", "Deprecated", "Removed"):
                  content = sections.get(heading, "").strip()
                  if content:
                      release_sections.append(f"### {heading}\n\n{content}")
              if not release_sections:
                  raise SystemExit("No releasable content exists under Unreleased")
              unreleased = "## [Unreleased]\n\n"
              if planned:
                  unreleased += f"### Planned\n\n{planned}\n\n"
              release = header + "\n\n" + "\n\n".join(release_sections) + "\n\n"
              text = text[:match.start()] + unreleased + release + text[match.end():]

          start = text.index(header)
          end = text.find("\n## [", start + len(header))
          if end < 0:
              end = len(text)
          section = text[start:end]
          required_phrases = (
              "hourly OpenCode",
              "minute 47",
              "three-runner",
              "immutable handoff",
              "NVIDIA_NIM_API_KEY",
              "COPILOT_GITHUB_TOKEN",
              "100% statement and branch coverage",
              "no merge",
              "APA 7",
          )
          if not all(phrase.casefold() in section.casefold() for phrase in required_phrases):
              assurance = (
                  "### Release assurance\n\n"
                  "- The hourly OpenCode control plane runs at minute 47 through a three-runner boundary and an immutable handoff.\n"
                  "- Direct model execution uses only `NVIDIA_NIM_API_KEY`; `COPILOT_GITHUB_TOKEN` remains prohibited and reviewer credentials are unchanged.\n"
                  "- APA 7 doctoring, no merge from the model workflow, and 100% statement and branch coverage remain release gates.\n\n"
              )
              text = text[:end].rstrip() + "\n\n" + assurance + text[end:].lstrip("\n")

          compare_link = f"[Unreleased]: https://github.com/ContextualWisdomLab/four-pillars/compare/v{version}...HEAD"
          text, count = re.subn(r'^\[Unreleased\]:.*$', compare_link, text, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("Unreleased comparison link is missing")
          release_link = f"[{version}]: https://github.com/ContextualWisdomLab/four-pillars/releases/tag/v{version}"
          if release_link not in text:
              text = text.replace(compare_link, compare_link + "\n" + release_link, 1)
          changelog.write_text(text, encoding="utf-8")
          PY
          rm -f .github/workflows/prepare-v0.8.0.yml
          rm -f .github/workflows/prepare-v0.8.0-on-push.yml
          rm -f .github/workflows/finalize-v0.8.0-on-push.yml
          rm -f .github/workflows/complete-v0.8.0.yml

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install immutable verification environment
        run: python -m pip install --require-hashes -r requirements/ci.txt

      - name: Run complete exact-tree release verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip check
          python scripts/product_gap_audit.py
          ruff check .
          python -m compileall -q src tests scripts
          python scripts/check_docs.py
          python scripts/check_prompts.py
          pytest -m 'not nim_live' -W error::ResourceWarning \
            --cov=four_pillars --cov-report=term-missing
          python -m build --no-isolation

      - name: Reject unresolved reviews or requested changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh pr view 24 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready 24 --repo "$GITHUB_REPOSITORY"
          fi
          review_json="$(gh api graphql -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}reviews(last:100){nodes{state}}}}}' -F owner='ContextualWisdomLab' -F name='four-pillars' -F number=24)"
          unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$review_json")"
          requested="$(jq '[.data.repository.pullRequest.reviews.nodes[] | select(.state == "CHANGES_REQUESTED")] | length' <<<"$review_json")"
          [ "$unresolved" -eq 0 ]
          [ "$requested" -eq 0 ]

      - name: Commit the exact verified release tree
        id: release_head
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'release: prepare Four Pillars v0.8.0'
            git push origin HEAD:release/v0.8.0
          fi
          head_sha="$(git rev-parse HEAD)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "head_sha=$head_sha" >>"$GITHUB_OUTPUT"

      - name: Squash-merge the verified release pull request
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${{ steps.release_head.outputs.head_sha }}"
          live_head="$(gh pr view 24 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [ "$live_head" = "$head_sha" ]
          state="$(gh pr view 24 --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          if [ "$state" = OPEN ]; then
            response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/24/merge" \
              -f sha="$head_sha" -f merge_method=squash \
              -f commit_title='release: publish Four Pillars v0.8.0')"
            jq -e '.merged == true' <<<"$response" >/dev/null
            merge_sha="$(jq -r .sha <<<"$response")"
          else
            merge_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          fi
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "merge_sha=$merge_sha" >>"$GITHUB_OUTPUT"

      - name: Close superseded prerequisite pull request when still open
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(gh pr view 23 --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)" = OPEN ]; then
            gh pr close 23 --repo "$GITHUB_REPOSITORY" \
              --comment 'The complete reviewed change set shipped through #24 and v0.8.0; closing the now-superseded queue item.'
          fi

      - name: Build and publish immutable release assets from main
        shell: bash
        run: |
          set -euo pipefail
          merge_sha="${{ steps.merge.outputs.merge_sha }}"
          git fetch origin main
          git checkout --detach "$merge_sha"
          [ "$(git rev-parse HEAD)" = "$merge_sha" ]
          [ "$(python -c 'from four_pillars import __version__; print(__version__)')" = "$RELEASE_VERSION" ]
          rm -rf dist
          python -m build --no-isolation
          (
            cd dist
            sha256sum four_pillars-0.8.0.tar.gz four_pillars-0.8.0-py3-none-any.whl >SHA256SUMS
          )
          python - <<'PY'
          from pathlib import Path
          version = "0.8.0"
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = f"## [{version}]"
          section = text.split(header, 1)[1].split("\n## [", 1)[0].strip()
          Path("$RUNNER_TEMP/release-notes.md").write_text(section + "\n", encoding="utf-8")
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            [ "$existing" = "$merge_sha" ] || [ "$existing" = main ]
          else
            gh release create "$RELEASE_TAG" \
              dist/four_pillars-0.8.0.tar.gz \
              dist/four_pillars-0.8.0-py3-none-any.whl \
              dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$merge_sha" \
              --title 'Four Pillars v0.8.0' \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
