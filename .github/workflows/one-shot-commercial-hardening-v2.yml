          old = "downloads.innerHTML=['report.pdf','report.html','report.json','chart.json','manifest.json'].map(name=>`<a href=\"/v1/reports/${id}/artifacts/${name}\">${name}</a>`).join('');message('보고서 생성이 완료되었습니다.');return"
          new = "downloads.innerHTML=['report.pdf','report.html','report.json','chart.json','manifest.json'].map(name=>`<button class=\"ghost\" type=\"button\" data-file=\"${name}\">${name}</button>`).join('');downloads.querySelectorAll('[data-file]').forEach(button=>button.addEventListener('click',()=>downloadArtifact(id,button.dataset.file)));message('보고서 생성이 완료되었습니다.');return"
          if old not in text:
              raise SystemExit('web download insertion point not found')
          text = text.replace(old, new, 1)
          marker = "async function poll(id){"
          helper = "async function downloadArtifact(id,name){try{message(`${name} 파일을 준비하고 있습니다…`);const response=await fetch(`/v1/reports/${id}/artifacts/${name}`,{headers:headers()});if(!response.ok)throw new Error(`HTTP ${response.status}`);const blob=await response.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();URL.revokeObjectURL(url);message(`${name} 다운로드를 시작했습니다.`)}catch(error){message(error.message,true)}}\n"
          if helper not in text:
              text = text.replace(marker, helper + marker, 1)
          input_marker = "document.querySelector('#calculate').addEventListener('click',calculate);"
          guard = "const calculationFields=new Set(['gender','birth-date','birth-time','calendar','leap','timezone']);form.addEventListener('input',event=>{if(reviewed&&calculationFields.has(event.target.id)){reviewed=null;generate.disabled=true;message('계산에 영향을 주는 입력이 바뀌었습니다. 계산을 다시 확인하세요.')}});\n"
          if guard not in text:
              text = text.replace(input_marker, guard + input_marker, 1)
          web.write_text(text, encoding='utf-8')

          test_api = Path('tests/test_api.py')
          text = test_api.read_text(encoding='utf-8')
          old = '    assert fetched.json()["status"] == "queued"\n'
          if old in text:
              text = text.replace(
                  old,
                  '    payload = fetched.json()\n'
                  '    assert payload["status"] == "queued"\n'
                  '    assert "request" not in payload\n'
                  '    assert "artifact_dir" not in payload\n',
                  1,
              )
          test_api.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/one-shot-*.yml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check --fix .
      - run: ruff format .
      - run: ruff check .
      - run: python -m compileall -q src tests scripts
      - run: python scripts/check_docs.py
      - run: python scripts/check_prompts.py
      - run: pytest -m 'not nim_live' -W error::ResourceWarning --cov=four_pillars --cov-report=term-missing
      - run: python -m build
      - name: Commit verified Python 3.11-compatible hardening
        run: |
          git config user.name 'four-pillars-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix: verify commercial hardening on Python 3.11'
          git push origin HEAD:fix/commercial-hardening
