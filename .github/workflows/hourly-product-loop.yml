name: Hourly Product Quality Loop

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hourly-product-loop
  cancel-in-progress: false

env:
  PYTHONPATH: src
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  product-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install the immutable verification environment
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - name: Run every release-quality and product-gap gate
        id: loop
        shell: bash
        run: |
          set +e
          mkdir -p artifacts
          report='artifacts/hourly-product-loop.md'
          printf '# Hourly Product Quality Loop\n\n' > "$report"
          printf -- '- Commit: `%s`\n- Run: `%s`\n- Trigger: `%s`\n\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" >> "$report"
          failures=0

          run_gate() {
            label="$1"
            shift
            log_file="$(mktemp)"
            "$@" >"$log_file" 2>&1
            exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              printf '## ✅ %s\n\n' "$label" >> "$report"
            else
              failures=1
              printf '## ❌ %s\n\n' "$label" >> "$report"
            fi
            printf '```text\n' >> "$report"
            tail -n 60 "$log_file" >> "$report"
            printf '\n```\n\n' >> "$report"
            rm -f "$log_file"
          }

          run_gate 'Dependency integrity' python -m pip check
          run_gate 'Product gap audit' python scripts/product_gap_audit.py --output artifacts/product-gap-audit.md
          run_gate 'Ruff and public API docstrings' ruff check .
          run_gate 'Python compilation' python -m compileall -q src tests scripts
          run_gate 'Project documents' python scripts/check_docs.py
          run_gate 'Versioned prompts' python scripts/check_prompts.py
          run_gate 'Offline tests and 100% coverage' pytest -m 'not orchestrator_live' -W error::ResourceWarning --cov=four_pillars --cov-report=term-missing
          run_gate 'Distribution build' python -m build --no-isolation

          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "failed=$failures" >> "$GITHUB_OUTPUT"
      - name: Synchronize the idempotent failure issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          LOOP_FAILED: ${{ steps.loop.outcome != 'success' || steps.loop.outputs.failed == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          title='[hourly-product-loop] release-quality regression'
          issue_number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          report='artifacts/hourly-product-loop.md'
          if [ ! -f "$report" ]; then
            mkdir -p artifacts
            cat > "$report" <<EOF
          # Hourly Product Quality Loop

          Status: **FAIL**

          Hourly loop did not produce a report because setup or an earlier workflow step failed.

          - Commit: \`$GITHUB_SHA\`
          - Run: \`$GITHUB_RUN_ID\`
          - Trigger: \`$GITHUB_EVENT_NAME\`
          EOF
          fi
          if [ "$LOOP_FAILED" = 'true' ]; then
            if [ -z "$issue_number" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
            else
              gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body-file "$report"
            fi
          elif [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY" --comment "The hourly release-quality and product-gap loop is green again at $GITHUB_SHA."
          fi
      - name: Enforce the loop result
        if: steps.loop.outputs.failed == '1'
        run: |
          echo 'One or more hourly product-quality gates failed.'
          exit 1
