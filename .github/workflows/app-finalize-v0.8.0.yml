name: App Finalize Four Pillars v0.8.0

on:
  push:
    branches:
      - release/v0.8.0
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: app-finalize-four-pillars-v0.8.0
  cancel-in-progress: false

jobs:
  verify_commit_merge_release:
    if: github.repository == 'ContextualWisdomLab/four-pillars'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      RELEASE_VERSION: 0.8.0
      RELEASE_TAG: v0.8.0
      RELEASE_DATE: 2026-08-07
    steps:
      - name: Check out the release candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v0.8.0
          fetch-depth: 0
          persist-credentials: false

      - name: Configure trusted Git identity
        run: |
          git config user.name 'four-pillars-maintainer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Merge current main and prerequisite feature without publishing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main
          if [ ! -f .github/workflows/hourly-nim-product-development.yml ]; then
            git fetch origin feat/hourly-nim-product-development
            git merge --no-edit origin/feat/hourly-nim-product-development
          fi

      - name: Normalize semantic release metadata and changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          version = "0.8.0"
          release_date = "2026-08-07"

          for filename, pattern, replacement, label in (
              ("pyproject.toml", r'^(version\s*=\s*)"[^"]+"', rf'\1"{version}"', "project"),
              ("src/four_pillars/version.py", r'^(__version__\s*=\s*)"[^"]+"', rf'\1"{version}"', "runtime"),
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{label} version was not uniquely replaceable")
              path.write_text(updated, encoding="utf-8")

          release_test = Path("tests/test_release_version.py")
          text = release_test.read_text(encoding="utf-8")
          text = re.sub(
              r'^RELEASE_VERSION\s*=\s*"[^"]+"',
              f'RELEASE_VERSION = "{version}"',
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r'^RELEASE_DATE\s*=\s*"[^"]+"',
              f'RELEASE_DATE = "{release_date}"',
              text,
              flags=re.MULTILINE,
          )
          release_test.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          header = f"## [{version}] - {release_date}"
          if header not in text:
              match = re.search(
                  r'^## \[Unreleased\]\n(?P<body>.*?)(?=^## \[)',
                  text,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if match is None:
                  raise SystemExit("Unreleased changelog section is missing")
              body = match.group("body").strip("\n")
              sections: dict[str, str] = {}
              for part in re.split(r'(?m)^### ', body)[1:]:
                  heading, _, content = part.partition("\n")
                  sections[heading.strip()] = content.strip("\n")
              planned = sections.get("Planned", "").strip()
              release_sections: list[str] = []
              for heading in ("Added", "Changed", "Security", "Fixed", "Deprecated", "Removed"):
                  content = sections.get(heading, "").strip()
                  if content:
                      release_sections.append(f"### {heading}\n\n{content}")
              if not release_sections:
                  raise SystemExit("No releasable content exists under Unreleased")
              unreleased = "## [Unreleased]\n\n"
              if planned:
                  unreleased += f"### Planned\n\n{planned}\n\n"
              release = header + "\n\n" + "\n\n".join(release_sections) + "\n\n"
              text = text[: match.start()] + unreleased + release + text[match.end() :]

          start = text.index(header)
          end = text.find("\n## [", start + len(header))
          if end < 0:
              end = len(text)
          section = text[start:end]
          phrases = (
              "hourly OpenCode",
              "minute 47",
              "three-runner",
              "immutable handoff",
              "NVIDIA_NIM_API_KEY",
              "COPILOT_GITHUB_TOKEN",
              "100% statement and branch coverage",
              "no merge",
              "APA 7",
          )
          if not all(phrase.casefold() in section.casefold() for phrase in phrases):
              assurance = (
                  "### Release assurance\n\n"
                  "- The hourly OpenCode control plane runs at minute 47 through a three-runner boundary and an immutable handoff.\n"
                  "- Direct model execution uses only `NVIDIA_NIM_API_KEY`; `COPILOT_GITHUB_TOKEN` remains prohibited and reviewer credentials are unchanged.\n"
                  "- APA 7 doctoring, no merge from the model workflow, and 100% statement and branch coverage remain release gates.\n\n"
              )
              text = text[:end].rstrip() + "\n\n" + assurance + text[end:].lstrip("\n")

          compare_link = (
              f"[Unreleased]: https://github.com/ContextualWisdomLab/four-pillars/compare/v{version}...HEAD"
          )
          text, count = re.subn(
              r'^\[Unreleased\]:.*$',
              compare_link,
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit("Unreleased comparison link is missing")
          release_link = (
              f"[{version}]: https://github.com/ContextualWisdomLab/four-pillars/releases/tag/v{version}"
          )
          if release_link not in text:
              text = text.replace(compare_link, compare_link + "\n" + release_link, 1)
          changelog.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-shot release control files from the shipping tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-v0.8.0.yml
          rm -f .github/workflows/prepare-v0.8.0-on-push.yml
          rm -f .github/workflows/finalize-v0.8.0-on-push.yml
          rm -f .github/workflows/complete-v0.8.0.yml
          rm -f .github/workflows/recover-v0.8.0-release.yml
          rm -f .github/workflows/app-finalize-v0.8.0.yml

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci.txt

      - name: Install immutable release verification dependencies
        run: python -m pip install --require-hashes -r requirements/ci.txt

      - name: Run every release-quality gate without mutation credentials
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN \
            -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL \
            -u ACTIONS_RESULTS_URL -u ACTIONS_CACHE_URL \
            -u GITHUB_ENV -u GITHUB_OUTPUT -u GITHUB_PATH \
            -u GITHUB_STATE -u GITHUB_STEP_SUMMARY \
            python -m pip check
          env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN python scripts/product_gap_audit.py
          env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN ruff check .
          env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN python -m compileall -q src tests scripts
          env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN python scripts/check_docs.py
          env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN python scripts/check_prompts.py
          env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN \
            pytest -m 'not nim_live' -W error::ResourceWarning \
              --cov=four_pillars --cov-report=term-missing
          env -u GH_TOKEN -u GITHUB_TOKEN -u REPOSITORY_TOKEN python -m build --no-isolation

      - name: Mint repository-scoped Maintainer App token after verification
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.FOUR_PILLARS_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.FOUR_PILLARS_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ContextualWisdomLab
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: write
          permission-metadata: read
          permission-pull-requests: write

      - name: Commit and push the exact verified release candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git -c core.hooksPath=/dev/null commit -m 'release: prepare Four Pillars v0.8.0'
          fi
          head_sha="$(git rev-parse HEAD)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          gh auth setup-git
          git push origin HEAD:release/v0.8.0
          echo "head_sha=$head_sha" >>"$GITHUB_OUTPUT"

      - name: Request exact-head automated review
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$(gh pr view 24 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready 24 --repo "$GITHUB_REPOSITORY"
          fi
          gh pr comment 24 --repo "$GITHUB_REPOSITORY" --body '@coderabbitai review' || true

      - name: Wait for all exact-head GitHub Checks
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          expected="${{ steps.candidate.outputs.head_sha }}"
          for attempt in $(seq 1 100); do
            live="$(gh pr view 24 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            [ "$live" = "$expected" ] || { echo '::error::release_head_advanced'; exit 1; }
            checks="$(gh pr checks 24 --repo "$GITHUB_REPOSITORY" --json name,state,bucket,link 2>/dev/null || true)"
            total="$(jq 'length' <<<"${checks:-[]}")"
            failed="$(jq '[.[] | select((.bucket // "") == "fail" or (.state // "") == "FAILURE" or (.state // "") == "ERROR" or (.state // "") == "CANCELLED" or (.state // "") == "TIMED_OUT" or (.state // "") == "ACTION_REQUIRED")] | length' <<<"${checks:-[]}")"
            pending="$(jq '[.[] | select((.bucket // "") == "pending" or (.state // "") == "PENDING" or (.state // "") == "QUEUED" or (.state // "") == "IN_PROGRESS" or (.state // "") == "WAITING" or (.state // "") == "REQUESTED")] | length' <<<"${checks:-[]}")"
            if [ "$failed" -gt 0 ]; then
              jq -r '.[] | select((.bucket // "") == "fail" or (.state // "") == "FAILURE" or (.state // "") == "ERROR") | [.name,.state,.link] | @tsv' <<<"$checks"
              echo '::error::exact_head_check_failed'
              exit 1
            fi
            if [ "$total" -ge 5 ] && [ "$pending" -eq 0 ]; then
              exit 0
            fi
            sleep 60
          done
          echo '::error::exact_head_checks_timed_out'
          exit 1

      - name: Enforce review and thread gates
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          review_json="$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}reviews(last:100){nodes{state author{login}}}}}}' \
            -F owner='ContextualWisdomLab' -F name='four-pillars' -F number=24)"
          unresolved="$(jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length' <<<"$review_json")"
          requested="$(jq '[.data.repository.pullRequest.reviews.nodes[] | select(.state == "CHANGES_REQUESTED")] | length' <<<"$review_json")"
          [ "$unresolved" -eq 0 ] || { echo '::error::unresolved_review_threads'; exit 1; }
          [ "$requested" -eq 0 ] || { echo '::error::changes_requested'; exit 1; }

      - name: Squash-merge only the exact reviewed head
        id: merge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          expected="${{ steps.candidate.outputs.head_sha }}"
          live="$(gh pr view 24 --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          [ "$live" = "$expected" ]
          response="$(gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/24/merge" \
            -f sha="$expected" \
            -f merge_method=squash \
            -f commit_title='release: publish Four Pillars v0.8.0')"
          jq -e '.merged == true' <<<"$response" >/dev/null
          merge_sha="$(jq -r .sha <<<"$response")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "merge_sha=$merge_sha" >>"$GITHUB_OUTPUT"

      - name: Wait for successful main-commit Checks
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          merge_sha="${{ steps.merge.outputs.merge_sha }}"
          for attempt in $(seq 1 100); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${merge_sha}/check-runs?per_page=100")"
            total="$(jq '.check_runs | length' <<<"$runs")"
            failed="$(jq '[.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "stale")] | length' <<<"$runs")"
            pending="$(jq '[.check_runs[] | select(.status != "completed")] | length' <<<"$runs")"
            if [ "$failed" -gt 0 ]; then
              jq -r '.check_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | [.name,.conclusion,.html_url] | @tsv' <<<"$runs"
              echo '::error::main_check_failed'
              exit 1
            fi
            if [ "$total" -ge 5 ] && [ "$pending" -eq 0 ]; then
              exit 0
            fi
            sleep 60
          done
          echo '::error::main_checks_timed_out'
          exit 1

      - name: Build immutable release assets from the merge commit
        shell: bash
        run: |
          set -euo pipefail
          merge_sha="${{ steps.merge.outputs.merge_sha }}"
          git fetch origin main --tags
          git checkout --detach "$merge_sha"
          [ "$(git rev-parse HEAD)" = "$merge_sha" ]
          [ "$(python -c 'from four_pillars import __version__; print(__version__)')" = "$RELEASE_VERSION" ]
          rm -rf dist
          python -m build --no-isolation
          (
            cd dist
            sha256sum four_pillars-0.8.0.tar.gz four_pillars-0.8.0-py3-none-any.whl >SHA256SUMS
          )
          python - <<'PY'
          from pathlib import Path
          import os

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = text.split("## [0.8.0]", 1)[1].split("\n## [", 1)[0].strip()
          notes = Path(os.environ["RUNNER_TEMP"]) / "four-pillars-v0.8.0-release-notes.md"
          notes.write_text(section + "\n", encoding="utf-8")
          PY

      - name: Publish or verify v0.8.0 without overwriting
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          merge_sha="${{ steps.merge.outputs.merge_sha }}"
          notes="$RUNNER_TEMP/four-pillars-v0.8.0-release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
            [ "$(git rev-list -n 1 "$RELEASE_TAG")" = "$merge_sha" ]
            assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for name in four_pillars-0.8.0.tar.gz four_pillars-0.8.0-py3-none-any.whl SHA256SUMS; do
              grep -Fx "$name" <<<"$assets" >/dev/null
            done
          else
            gh release create "$RELEASE_TAG" \
              dist/four_pillars-0.8.0.tar.gz \
              dist/four_pillars-0.8.0-py3-none-any.whl \
              dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$merge_sha" \
              --title 'Four Pillars v0.8.0' \
              --notes-file "$notes"
          fi

      - name: Drain the superseded prerequisite PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if [ "$(gh pr view 23 --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || true)" = OPEN ]; then
            gh pr close 23 --repo "$GITHUB_REPOSITORY" \
              --comment 'The reviewed feature and release shipped through #24 and v0.8.0; the duplicate queue item is now drained.'
          fi
