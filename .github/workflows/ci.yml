name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: src
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/ci.txt
      - name: Install the immutable CI environment
        run: python -m pip install --require-hashes -r requirements/ci.txt
      - run: python -m pip check
      - run: ruff check .
      - run: python -m compileall -q src tests scripts
      - run: python scripts/check_docs.py
      - run: python scripts/check_prompts.py
      - run: pytest -m 'not nim_live' -W error::ResourceWarning --cov=four_pillars --cov-report=term-missing
      - run: python -m build --no-isolation
        if: matrix.python-version == '3.12'

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build the pinned runtime image
        run: docker build --tag four-pillars:pr .
      - name: Verify runtime imports and application metadata
        run: >-
          docker run --rm four-pillars:pr python -c
          "import four_pillars; from four_pillars.api import app; assert app.version == four_pillars.__version__; assert app.version"
